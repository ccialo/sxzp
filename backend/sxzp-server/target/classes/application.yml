server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: sxzp-server
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 请按本机 MySQL 实际情况修改用户名/密码
    url: jdbc:mysql://localhost:3306/sxzp?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: 1234
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.sxzp.**.entity

# 业务自定义配置
sxzp:
  jwt:
    # 生产环境请替换为足够长度的随机密钥
    secret: sxzp-campus-internship-recruitment-platform-secret-key-2026
    # 令牌有效期(毫秒)：24 小时
    expire: 86400000
    header: Authorization
    prefix: "Bearer "
  upload:
    # 上传文件存储目录（相对于项目运行目录）
    dir: ./uploads

logging:
  level:
    com.sxzp: debug
    org.springframework.security: warn
